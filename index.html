<style>
/* One committed look: the deep wine of the velvet the works are photographed on. */
:root{
  --bg:#160409; --surface:#210a11; --ink:#F2E8E4; --muted:#BCA1A6; --line:#4A2029;
  --accent:#F0A79F; --sold:#E5566B;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;background:#160409}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.125rem/1.62 var(--serif);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:clamp(16px,4vw,48px)}
.skip{position:absolute;left:-9999px;top:8px;background:var(--ink);color:var(--bg);padding:8px 12px;font:500 .75rem var(--mono);z-index:20}
.skip:focus{left:8px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 28px;padding-block:20px;border-bottom:1px solid var(--line)}
.brand{font:500 .78rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
.nav{display:flex;flex-wrap:wrap;gap:8px 24px}
.nav a{font:400 .72rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding-block:6px}
.nav a:hover{color:var(--accent)}
.lang{display:flex;border:1px solid var(--ink)}
.lang button{font:500 .7rem/1 var(--mono);letter-spacing:.1em;padding:8px 11px;background:none;border:0;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* type bits */
.kicker{font:500 .72rem/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
h1,h2,h3{font-family:var(--serif);margin:0;text-wrap:balance}
h2{font-weight:300;font-size:clamp(2rem,5vw,3.5rem);line-height:1.06;letter-spacing:-.01em;margin-bottom:22px}
.btn{display:inline-flex;align-items:center;gap:10px;font:500 .74rem/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;text-decoration:none;padding:15px 20px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);transition:background .2s,border-color .2s,color .2s}
.btn:hover{background:var(--accent);border-color:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:transparent;border-color:var(--accent);color:var(--accent)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:clamp(28px,5vw,72px);align-items:end;padding-block:clamp(36px,6vw,84px) clamp(56px,8vw,112px)}
.hero h1{font-weight:200;font-size:clamp(3.4rem,10.5vw,8.6rem);line-height:.92;margin:0 0 clamp(24px,3vw,40px)}
.hero h1 span{display:block}
.hero h1 .n1{font-style:italic;letter-spacing:-.025em}
.hero h1 .n2{font-weight:300;letter-spacing:.07em;font-size:.86em}
.lede{font:300 clamp(1.3rem,2.4vw,1.75rem)/1.35 var(--serif);max-width:28rem;margin:0 0 32px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.feature{margin:0;justify-self:end;width:100%;max-width:440px}
.feature .frame{aspect-ratio:4/5;background:var(--surface);box-shadow:0 30px 60px -30px #000}
.feature img{display:block;width:100%;height:100%;object-fit:cover}
.feature figcaption{font:italic 300 .95rem/1.4 var(--serif);color:var(--muted);margin-top:12px}
.feature figcaption em{color:var(--ink)}

/* sections */
.sec{padding-block:clamp(56px,9vw,120px);border-top:1px solid var(--line)}
.sec-head{max-width:44rem;margin-bottom:clamp(20px,4vw,40px)}
.sec-head p{margin:0;color:var(--muted)}

/* gallery */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:clamp(24px,4vw,40px)}
.filters button{font:500 .7rem/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;background:none;border:1px solid var(--line);padding:9px 12px;cursor:pointer;color:var(--muted)}
.filters button:hover{border-color:var(--ink);color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.filters button i{font-style:normal;opacity:.6;margin-left:6px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:34px 22px}
.tile{display:block;padding:0;border:0;background:none;text-align:left;cursor:zoom-in}
.tile .frame{display:block;aspect-ratio:4/5;background:var(--surface);overflow:hidden}
.tile img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.tile:hover img{transform:scale(1.035)}
.tile .cap{display:block;margin-top:12px}
.tile .cap b{display:block;font-weight:400;font-size:1.05rem;line-height:1.3}
.tile .cap small{display:block;font:400 .72rem/1.5 var(--mono);letter-spacing:.06em;color:var(--muted);margin-top:3px}
.sold{color:var(--sold);font:500 .68rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.sold::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sold);margin-right:6px;transform:translateY(-1px)}

/* lightbox */
dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:none;max-height:none;width:100vw;height:100dvh}
dialog::backdrop{background:rgba(9,1,4,.94)}
dialog[open]{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:56px 16px 20px}
.lb-img{max-width:min(92vw,760px);max-height:calc(100dvh - 210px);width:auto;height:auto;object-fit:contain;box-shadow:0 30px 80px -30px #000}
.lb-cap{text-align:center;max-width:36rem}
.lb-cap b{display:block;font:300 1.5rem/1.25 var(--serif)}
.lb-cap em{display:block;font-style:italic;color:var(--muted);font-size:1rem}
.lb-cap small{display:block;font:400 .72rem/1.6 var(--mono);letter-spacing:.06em;color:var(--muted);margin-top:8px;text-transform:uppercase}
.lb-btn{position:fixed;background:none;border:1px solid var(--line);width:46px;height:46px;cursor:pointer;font:400 1.4rem/1 var(--mono);display:grid;place-items:center}
.lb-btn:hover{border-color:var(--accent);color:var(--accent)}
.lb-close{top:14px;right:14px}
.lb-prev{left:14px;top:50%;transform:translateY(-50%)}
.lb-next{right:14px;top:50%;transform:translateY(-50%)}

/* about */
.about{display:grid;grid-template-columns:minmax(0,.55fr) minmax(0,1.45fr);gap:clamp(28px,6vw,88px);align-items:start}
.portrait{margin:0;max-width:260px}
.portrait img{display:block;width:100%;height:auto;filter:grayscale(1)}
.portrait figcaption{font:400 .72rem/1.6 var(--mono);letter-spacing:.06em;color:var(--muted);margin-top:14px}
.statement p{font:300 clamp(1.25rem,2.2vw,1.65rem)/1.5 var(--serif);margin:0 0 .9em;max-width:38rem}
.statement p:first-of-type{font-size:clamp(1.6rem,3vw,2.3rem);line-height:1.25;font-style:italic;font-weight:300}

/* cv */
.cv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(36px,6vw,80px) clamp(28px,6vw,88px)}
.cv-block h3{font:500 .74rem/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;padding-bottom:14px;border-bottom:1px solid var(--ink)}
.cv{list-style:none;margin:0;padding:0}
.cv li{display:grid;grid-template-columns:3.6rem minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.cv .yr{font:500 .8rem/1.9 var(--mono);letter-spacing:.04em;color:var(--accent)}
.cv .tx{font-size:1.02rem;line-height:1.5}
.cv .tx b{display:block;font-weight:400;font-size:1.1rem}
.cv .tx small{display:block;font-size:.96rem;color:var(--muted);line-height:1.45}

/* buy */
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 clamp(24px,5vw,72px);margin:0}
.facts div{border-top:1px solid var(--ink);padding:16px 0 30px}
.facts dt{font:500 .72rem/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.facts dd{margin:0;color:var(--muted);max-width:28rem}

/* contact */
.contact h2{font-size:clamp(2.2rem,6vw,4.6rem);font-style:italic;font-weight:200;max-width:16em}
.contact p{margin:0 0 28px;max-width:30rem;color:var(--muted)}
footer{border-top:1px solid var(--line);padding-block:26px 40px;font:400 .72rem/1.6 var(--mono);letter-spacing:.08em;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .feature{justify-self:start;max-width:380px}
  .about{grid-template-columns:1fr}
  .portrait{max-width:200px}
  .cv-grid{grid-template-columns:1fr}
}
@media (max-width:640px){
  .nav{order:3;width:100%}
  .facts{grid-template-columns:1fr}
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px}
  .lb-prev,.lb-next{top:auto;bottom:14px;transform:none}
  .lb-prev{left:14px}.lb-next{right:14px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn,.tile img{transition:none}.tile:hover img{transform:none}}
</style>
</head>

  var lang='uk', filter='all', cur=0, list=[];
  try{var sv=localStorage.getItem('vr-lang');if(sv==='en'||sv==='uk')lang=sv;}catch(e){}
  function $(id){return document.getElementById(id);}
  function li(){return lang==='uk'?0:1;}
  function fmtSize(s){return s.replace('×',' × ')+' '+T[lang].cm;}

  function cvRows(rows,withSub){
    var k=li();
    return rows.map(function(r){
      var main=r[1+2*k],sub=r[2+2*k];
      return '<li><span class="yr">'+r[0]+'</span><div class="tx">'+(sub?'<b>'+main+'</b><small>'+sub+'</small>':main)+'</div></li>';
    }).join('');
  }

  function renderFilters(){
    var t=T[lang],keys=Object.keys(SERIES),html='';
    function btn(k,label,n){return '<button type="button" data-f="'+k+'" aria-pressed="'+(filter===k)+'">'+label+'<i>'+n+'</i></button>';}
    html+=btn('all',t.all,W.length);
    keys.forEach(function(k){
      var n=W.filter(function(w){return w.s===k;}).length;
      html+=btn(k,SERIES[k][li()],n);
    });
    $('filters').innerHTML=html;
  }

  function renderGallery(){
    var t=T[lang],k=li();
    list=W.filter(function(w){return filter==='all'||w.s===filter;});
    $('gallery').innerHTML=list.map(function(w,i){
      return '<button type="button" class="tile" data-n="'+i+'"><span class="frame"><img loading="lazy" src="'+w.id+'.jpg" alt="'+w.t[1]+'"></span>'+
        '<span class="cap"><b>'+w.t[k]+'</b><small>'+w.y+' · '+fmtSize(w.size)+'</small>'+
        (w.sold?'<small><span class="sold">'+t.sold+'</span></small>':'')+'</span></button>';
    }).join('');
  }

  function showLb(n){
    var t=T[lang],k=li(),w=list[n];if(!w)return;
    cur=n;
    $('lbImg').src=''+w.id+'.jpg';$('lbImg').alt=w.t[1];
    $('lbCap').innerHTML='<b>'+w.t[k]+'</b>'+(w.t[0]!==w.t[1]?'<em>'+w.t[1-k]+'</em>':'')+
      '<small>'+SERIES[w.s][k]+'<br>'+w.y+' · '+fmtSize(w.size)+' · '+M[w.m][k]+
      (w.f?' · '+t.framed:'')+(w.sold?' · '+t.sold:'')+'</small>';
    $('lbPrev').style.visibility=list.length>1?'visible':'hidden';
    $('lbNext').style.visibility=list.length>1?'visible':'hidden';
  }
  function openLb(n){showLb(n);var d=$('lb');if(!d.open)d.showModal();}
  function step(d){showLb((cur+d+list.length)%list.length);}

  function render(){
    var t=T[lang],i,k=li();
    document.documentElement.lang=lang;
    var nodes=document.querySelectorAll('[data-i]');
    for(i=0;i<nodes.length;i++){var v=t[nodes[i].getAttribute('data-i')];if(v!=null)nodes[i].innerHTML=v;}
    $('featCap').innerHTML=t.featCap;
    $('statement').innerHTML=t.statement.map(function(p){return '<p>'+p+'</p>';}).join('');
    $('cvEdu').innerHTML=cvRows(CV.edu);
    $('cvAwards').innerHTML=cvRows(CV.awards);
    $('cvGroup').innerHTML=cvRows(CV.group);
    $('cvSolo').innerHTML=cvRows(CV.solo);
    $('facts').innerHTML=t.facts2.map(function(f){return '<div><dt>'+f[0]+'</dt><dd>'+f[1]+'</dd></div>';}).join('');
    $('lbClose').setAttribute('aria-label',t.close);$('lbPrev').setAttribute('aria-label',t.prev);$('lbNext').setAttribute('aria-label',t.next);
    $('lang-uk').setAttribute('aria-pressed',String(lang==='uk'));
    $('lang-en').setAttribute('aria-pressed',String(lang==='en'));
    renderFilters();renderGallery();
    if($('lb').open)showLb(Math.min(cur,list.length-1));
  }

  document.querySelector('.lang').addEventListener('click',function(e){
    var b=e.target.closest('button[data-lang]');if(!b)return;
    lang=b.getAttribute('data-lang');
    try{localStorage.setItem('vr-lang',lang);}catch(err){}
    render();
  });
  $('filters').addEventListener('click',function(e){
    var b=e.target.closest('button[data-f]');if(!b)return;
    filter=b.getAttribute('data-f');renderFilters();renderGallery();
  });
  $('gallery').addEventListener('click',function(e){
    var b=e.target.closest('.tile');if(!b)return;
    openLb(+b.getAttribute('data-n'));
  });
  $('lbClose').addEventListener('click',function(){$('lb').close();});
  $('lbPrev').addEventListener('click',function(){step(-1);});
  $('lbNext').addEventListener('click',function(){step(1);});
  $('lb').addEventListener('click',function(e){if(e.target===this)this.close();});
  document.addEventListener('keydown',function(e){
    if(!$('lb').open)return;
    if(e.key==='ArrowLeft')step(-1);
    if(e.key==='ArrowRight')step(1);
  });
  render();
