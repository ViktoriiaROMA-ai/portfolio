<style>
/* One committed look: the deep wine of the velvet the works are photographed on. */
:root{
  --bg:#160409; --surface:#210a11; --ink:#F2E8E4; --muted:#BCA1A6; --line:#4A2029;
  --accent:#F0A79F; --sold:#E5566B;
  --display:"Playfair Display",Georgia,serif;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --label:"Jost","Helvetica Neue",Arial,sans-serif;
  --dw:400;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;background:#160409;scroll-padding-top:var(--hh,64px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.62 var(--serif);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:clamp(16px,4vw,48px)}
.skip{position:absolute;left:-9999px;top:8px;background:var(--ink);color:var(--bg);padding:8px 12px;font:500 0.79rem var(--label);z-index:20}
.skip:focus{left:8px}

/* header — stays pinned to the top while scrolling */
.top{position:sticky;top:0;z-index:10;background:rgba(22,4,9,.93);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 28px;padding-block:14px;border-bottom:1px solid var(--line)}
.brand{font:500 0.82rem/1 var(--label);letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
.nav{display:flex;flex-wrap:wrap;gap:8px 24px}
.nav a{font:400 0.76rem/1 var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding-block:6px}
.nav a:hover{color:var(--accent)}
.lang{display:flex;border:1px solid var(--ink)}
.lang button{font:500 0.74rem/1 var(--label);letter-spacing:.1em;padding:8px 11px;background:none;border:0;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* type bits */
.kicker{font:500 0.76rem/1.2 var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
h1,h2,h3{font-family:var(--display);font-weight:var(--dw);margin:0;text-wrap:balance}
h2{font-weight:var(--dw);font-size:clamp(2.05rem,7.2vw,3.60rem);line-height:1.08;letter-spacing:-.005em;margin-bottom:20px}
.btn{display:inline-flex;align-items:center;gap:10px;font:500 0.78rem/1 var(--label);letter-spacing:.09em;text-transform:uppercase;text-decoration:none;padding:15px 22px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);white-space:nowrap;justify-content:center;transition:background .2s,border-color .2s,color .2s}
.btn:hover{background:var(--accent);border-color:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:transparent;border-color:var(--accent);color:var(--accent)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:clamp(28px,5vw,72px);align-items:end;padding-block:clamp(36px,6vw,84px) clamp(56px,8vw,112px)}
.hero h1{font-weight:var(--dw);font-size:clamp(3.30rem,13.5vw,8.40rem);line-height:.95;margin:0 0 clamp(22px,3vw,36px)}
.hero h1 span{display:block}
.hero h1 .n1{font-style:italic;letter-spacing:-.02em;font-weight:400}
.hero h1 .n2{font-weight:var(--dw);letter-spacing:.08em;font-size:.84em}
.lede{font:400 clamp(1.20rem,4.6vw,1.70rem)/1.35 var(--display);max-width:28rem;margin:0 0 28px}
.cta{display:flex;flex-wrap:wrap;gap:10px 12px}
.btn .sm{display:none}
.feature{margin:0;justify-self:end;width:100%;max-width:440px}
.feature .frame{aspect-ratio:4/5;background:var(--surface);box-shadow:0 30px 60px -30px #000}
.feature img{display:block;width:100%;height:100%;object-fit:cover}
.feature figcaption{font:italic 400 .98rem/1.4 var(--serif);color:var(--muted);margin-top:12px}
.feature figcaption em{color:var(--ink)}

/* sections */
.sec{padding-block:clamp(56px,9vw,120px);border-top:1px solid var(--line)}
.sec-head{max-width:44rem;margin-bottom:clamp(20px,4vw,40px)}
.sec-head p{margin:0;color:var(--muted)}

/* gallery */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:clamp(24px,4vw,40px)}
.filters button{font:500 0.74rem/1.2 var(--label);letter-spacing:.09em;text-transform:uppercase;background:none;border:1px solid var(--line);padding:9px 12px;cursor:pointer;color:var(--muted)}
.filters button:hover{border-color:var(--ink);color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.filters button i{font-style:normal;opacity:.6;margin-left:6px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:34px 22px}
.tile{display:block;padding:0;border:0;background:none;text-align:left;cursor:zoom-in}
.tile .frame{display:block;aspect-ratio:4/5;background:var(--surface);overflow:hidden}
.tile img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.tile:hover img{transform:scale(1.035)}
.tile .cap{display:block;margin-top:12px}
.tile .cap b{display:block;font-family:var(--display);font-weight:var(--dw);font-size:1.12rem;line-height:1.25}
.tile .cap small{display:block;font:400 0.76rem/1.5 var(--label);letter-spacing:.06em;color:var(--muted);margin-top:3px}
.sold{color:var(--sold);font:500 0.72rem/1 var(--label);letter-spacing:.1em;text-transform:uppercase}
.sold::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sold);margin-right:6px;transform:translateY(-1px)}

/* projects */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:40px 26px}
.pcard{display:block;width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer}
.pcard .frame{display:block;aspect-ratio:3/2;background:var(--surface);overflow:hidden}
.pcard img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.pcard:hover img{transform:scale(1.035)}
.pcard .cap{display:block;margin-top:12px}
.pcard .cap b{display:block;font-family:var(--display);font-weight:var(--dw);font-size:1.20rem;line-height:1.25}
.pcard .cap small{display:block;font:400 0.76rem/1.5 var(--label);letter-spacing:.06em;color:var(--muted);margin-top:3px;text-transform:uppercase}
#pd{background:var(--bg);overflow:auto}
#pd[open]{display:block;padding:0}
.pd-in{max-width:1080px;margin:0 auto;padding:72px clamp(16px,4vw,40px) 64px}
.pd-in h3{font:var(--dw) clamp(2.00rem,7vw,3.20rem)/1.1 var(--display);margin:0 0 12px}
.pd-meta{font:400 0.76rem/1.6 var(--label);letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:0 0 24px}
.pd-text p{font:400 1.1rem/1.6 var(--serif);max-width:44rem;margin:0 0 1em}
.pd-links{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 36px}
.pd-meta+.pd-meta{margin-top:-14px}
.pd-text{margin-bottom:28px}
.pd-grid{columns:3 260px;column-gap:18px}
.pd-grid button{display:block;width:100%;padding:0;border:0;background:var(--surface);margin:0 0 18px;cursor:zoom-in;break-inside:avoid}
.pd-grid img{display:block;width:100%;height:auto}
.pd-close{z-index:2;background:var(--bg)}
@media (prefers-reduced-motion:reduce){.pcard img{transition:none}.pcard:hover img{transform:none}}

/* lightbox */
dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:none;max-height:none;width:100vw;height:100dvh}
dialog::backdrop{background:rgba(9,1,4,.94)}
dialog[open]{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:56px 16px 20px}
.lb-img{max-width:min(92vw,760px);max-height:calc(100dvh - 210px);width:auto;height:auto;object-fit:contain;box-shadow:0 30px 80px -30px #000}
.lb-cap{text-align:center;max-width:36rem}
.lb-cap b{display:block;font:var(--dw) 1.55rem/1.25 var(--display)}
.lb-cap em{display:block;font-style:italic;color:var(--muted);font-size:1rem}
.lb-cap small{display:block;font:400 0.76rem/1.6 var(--label);letter-spacing:.06em;color:var(--muted);margin-top:8px;text-transform:uppercase}
.lb-btn{position:fixed;background:none;border:1px solid var(--line);width:46px;height:46px;cursor:pointer;font:400 1.4rem/1 var(--label);display:grid;place-items:center}
.lb-btn:hover{border-color:var(--accent);color:var(--accent)}
.lb-close{top:14px;right:14px}
.lb-prev{left:14px;top:50%;transform:translateY(-50%)}
.lb-next{right:14px;top:50%;transform:translateY(-50%)}

/* about */
.about{display:grid;grid-template-columns:minmax(0,.55fr) minmax(0,1.45fr);gap:clamp(28px,6vw,88px);align-items:start}
.portrait{margin:0;max-width:260px}
.portrait img{display:block;width:100%;height:auto;filter:grayscale(1)}
.portrait figcaption{font:400 0.76rem/1.6 var(--label);letter-spacing:.06em;color:var(--muted);margin-top:14px}
.statement p{font:400 clamp(1.1rem,2vw,1.4rem)/1.55 var(--serif);margin:0 0 .9em;max-width:38rem}
.statement p:first-of-type{font-family:var(--display);font-size:clamp(1.55rem,5.6vw,2.40rem);line-height:1.22;font-style:italic;font-weight:400}

/* cv (lives inside the About section) */
.cv-wrap{margin-top:clamp(56px,8vw,104px);padding-top:clamp(40px,6vw,72px);border-top:1px solid var(--line)}
.cv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(36px,6vw,80px) clamp(28px,6vw,88px)}
.cv-block h3{font:500 0.78rem/1.2 var(--label);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;padding-bottom:14px;border-bottom:1px solid var(--ink)}
.cv{list-style:none;margin:0;padding:0}
.cv li{display:grid;grid-template-columns:3.6rem minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.cv .yr{font:500 0.84rem/1.9 var(--label);letter-spacing:.04em;color:var(--accent)}
.cv .tx{font-size:1.02rem;line-height:1.5}
.cv .tx b{display:block;font-weight:500;font-size:1.05rem}
.cv .tx small{display:block;font-size:.96rem;color:var(--muted);line-height:1.45}

/* buy */
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 clamp(24px,5vw,72px);margin:0}
.facts div{border-top:1px solid var(--ink);padding:16px 0 30px}
.facts dt{font:500 0.76rem/1.2 var(--label);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.facts dd{margin:0;color:var(--muted);max-width:28rem}
.buy-cta{margin-top:clamp(20px,3vw,36px)}

/* contact */
.contact h2{font-size:clamp(2.30rem,9vw,4.60rem);font-style:italic;font-weight:400;max-width:16em}
.contact p{margin:0 0 28px;max-width:30rem;color:var(--muted)}
footer{border-top:1px solid var(--line);padding-block:26px 40px;font:400 0.76rem/1.6 var(--label);letter-spacing:.08em;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .feature{justify-self:start;max-width:380px}
  .about{grid-template-columns:1fr}
  .portrait{max-width:200px}
  .cv-grid{grid-template-columns:1fr}
}
@media (max-width:640px){
  .top{padding-block:10px;gap:8px 16px}
  .nav{order:3;width:100%;flex-wrap:nowrap;justify-content:space-between;gap:0 6px}
  .nav a{padding-block:5px;white-space:nowrap;font-size:clamp(.62rem,2.95vw,.78rem);letter-spacing:.07em}
  .btn{padding:14px 14px;font-size:clamp(.66rem,3vw,.78rem);letter-spacing:.06em}
  .cta{flex-wrap:nowrap;gap:10px}
  .cta .btn{flex:1 1 auto;min-width:0;gap:6px}
  .btn .lg{display:none}
  .btn .sm{display:inline}
  .kicker{font-size:.72rem;letter-spacing:.12em}
  .facts{grid-template-columns:1fr}
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px}
  .lb-prev,.lb-next{top:auto;bottom:14px;transform:none}
  .lb-prev{left:14px}.lb-next{right:14px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn,.tile img{transition:none}.tile:hover img{transform:none}}
</style>
</head>

{slug:'twenty-questions',n:12,v:0,y:2023,t:['20 запитань і 20 відповідей','20 Questions and 20 Answers'],m:['Серія графічних робіт · Папір, лайнер · Тель-Авів, Ізраїль','Series of drawings · Paper, liner · Tel Aviv, Israel'],d:null},
{slug:'ghosts',n:10,v:1,y:'2022–2023',url:'https://www.behance.net/gallery/157061763/GHOSTS',t:['Привиди','Ghosts'],m:['Відеоперформанс · Львів – Тель-Авів','Video performance · Lviv – Tel Aviv'],d:['Проєкт відображає проблему родин, розділених війною в Україні, відтворюючи спілкування подружжя на відстані.\nВідео (проєкцію) обрано основним медіумом як найкращий спосіб передати нереальність такого спілкування: спотворення звуку, затримку й деформацію зображення.\nОснова роботи — документальні файли (відео, аудіо й текст), накопичені під час перебування на резиденції. Вони фіксують дві паралельні реальності, у яких перебувають художники. Цей процес обміну новинами й емоціями в глобальному сенсі відображає українське суспільство, розділене на тих, хто виїхав під час бойових дій, і тих, хто залишився.\nОсновою стала взаємодія із «проєкцією з іншого часу», за аналогією до паперових листів, де ти під час відкриття листа/відео щоразу опинявся в минулому. Найдовша зустріч із «повідомленням» сталася через 3 місяці, після надсилання.','The project reflects the problem of families separated by the war in Ukraine, reproducing the communication of spouses at a distance.\nVideo (projection) was chosen as the main medium as the best means of conveying the unreality of such communication: sound distortion, delay and image deformation.\nThe work is based on documentary files (video, audio and text) accumulated during a residency. They record two parallel realities in which the artists find themselves. This exchange of news and emotions is, in a global sense, a reflection of Ukrainian society, divided between those who left the country during the hostilities and those who stayed.\nThe basis was interaction with a “projection from another time”, by analogy with paper letters, where each time you opened a letter/video you found yourself in the past. The longest encounter with a “message” happened 3 months after it was sent.']},

{slug:'kreminna',n:5,v:0,y:0,url:'https://www.behance.net/gallery/146515037/kremnnaukrana',t:['Кремінна/Україна','Kreminna/Ukraine'],d:null},
{slug:'psychology-of-war',n:11,v:2,y:2022,url:'https://www.behance.net/gallery/146520357/psihologja-vjni',t:['Психологія війни','Psychology of War'],d:['Благодійний мистецький пленер УКУ «На межі». Серія «Стани війни»: «Зміна реальності», «Гнів», «Депресія», «Прийняття» (полотно, вугілля, акрил).\nСерія «Стани війни» — про військові дії, які відбуваються у кожного з нас, незалежно від того, де ми перебуваємо.\n«Зміна реальності» — як мить, коли було натиснуто на спусковий гачок: те, що відбулося потім, уже неможливо порівнювати з тим, що існувало до.\n«Гнів» — це не завжди бій, це можуть бути сльози й втеча, але завжди це найпотужніша реакція, яка керує нами. Після цього завжди приходить спустошення.\n«Депресія». Дослідження стверджують, що «через півроку майже всі відчувають зменшення негативних емоцій, проте повного одужання не настає…»\n«Прийняття» — дія, яка зараз не може бути завершена, бо як можна змиритись і прийняти те, що не має кінця й щодня завдає тобі нового болю…','Charity art plein air of the Ukrainian Catholic University “On the Edge”. Series “States of War”: “Change of Reality”, “Anger”, “Depression”, “Acceptance” (canvas, charcoal, acrylic).\nThe “States of War” series is about the hostilities that take place within each of us, regardless of where we are.\n“Change of Reality” is like the moment the trigger was pulled: what happened afterwards can no longer be compared with what existed before.\n“Anger” is not always a fight; it may be tears and flight, but it is always the most powerful reaction, the one that governs us. Emptiness always follows.\n“Depression”. Studies say that “after six months almost everyone feels a decrease in negative emotions, but full recovery does not come…”\n“Acceptance” is an action that cannot be completed now, because how can one come to terms with and accept what has no end and inflicts new pain every day…']},
{slug:'post-traumatic-syndrome',n:6,v:0,y:0,url:'https://www.behance.net/gallery/145073171/Post-traumatic-syndrome',t:['Посттравматичний синдром','Post-traumatic syndrome'],d:null},
{slug:'watchman',n:13,v:0,y:2019,url:'https://www.behance.net/gallery/145921019/Watchman',t:['Сторожа','Watchman'],m:['Графічні роботи, перформанс · Полотно, акрил, вугілля · 75×300 см · Київ, Україна','Graphic works, performance · Canvas, acrylic, charcoal · 75×300 cm · Kyiv, Ukraine'],d:['«Образ», що не має окремих рис чи будь-якої іншої персоналізації.\nРоботи створено в пам’ять про друзів, які загинули під час Революції Гідності.','An “image” with no individual features or any other personalisation.\nThe works were created in memory of friends who died during the Revolution of Dignity.']},
{slug:'cage',n:3,v:0,y:2019,url:'https://www.behance.net/gallery/113725307/Cage',t:['Cage','Cage'],d:['Обмеження й правила: що вони означають у контексті особистої та індивідуальної свободи? Символічна клітка чи захист від «зовнішнього».\nРозміри скульптур: 75×40×330. Матеріал: дерево, металевий дріт. Луцьк, 2019.\nСвоєрідна форма протесту: з одного боку, вона дає право висловити свою точку зору, з іншого — змушує суворо дотримуватися встановлених принципів заради досягнення мети. Ваші думки й бажання обмежені зовнішньою оболонкою, яку ми створюємо самі. Зовнішні стереотипи, правила й страхи будують навколо нас каркас, у якому ми проживаємо все життя. Питання лишається: бути захищеним і жити в клітці — чи жити без захисту, але вільним.\nПроєкт передбачає створення каркасних скульптур, які стають символічною кліткою для реальних людей. Презентація має форму перформансу. Складники: перформанс, інсталяція.','Restrictions and rules: what are they in the context of personal and individual freedom? A symbolic cage, or protection from the “outside”.\nDimensions of the sculptures: 75×40×330. Material: wood, metal wire. Lutsk, 2019.\nA peculiar form of protest which, on the one hand, gives you the right to express your point of view and, on the other, forces you to adhere strictly to the set principles in order to achieve the goal. Your thoughts and desires are limited by the outer shell that we create for ourselves. External stereotypes, rules and fears build a frame around us in which we spend our whole life. The question remains: to be protected and live in a cage, or to live without protection but free.\nThe project involves creating frame sculptures that become a symbolic cage for real people. The presentation takes the form of a performance. Components: performance, installation.']},

{slug:'nyenskans',n:4,v:0,y:0,url:'https://www.behance.net/gallery/146516357/Nyenskans',t:['Nyenskans','Nyenskans'],d:['Ніеншанц (швед. Nyenskans) — шведська фортеця на злитті річок Нева й Охта, на місці якої пізніше постав Санкт-Петербург. Збудована 1611 року для утвердження шведської влади в Інгрії; 1702 року фортецю й місто Ніен захопила Росія під час Північної війни.','Nyenschantz (Nyenskans) was a Swedish fortress at the confluence of the Neva and Okhta rivers, on the site of present-day Saint Petersburg. It was built in 1611 to establish Swedish rule in Ingria; in 1702 the fortress and the town of Nyen were conquered by Russia during the Great Northern War.']},

{slug:'active-inaction',n:6,v:0,y:2021,t:['Активна бездіяльність','Active Inaction'],m:['Перформанс, фотодокументація · Резиденція «Contemporary Art Рівне»','Performance, photo documentation · “Contemporary Art Rivne” residency'],d:['Художниця збирає сміття на березі річки, а потім викидає його назад у річку.\nУ цьому випадку активна робота художника дає такий самий результат, як і повна байдужість.\nСам проєкт абсолютно ніяк не впливає на поточну екологічну ситуацію річки.','The artist collects rubbish on the riverbank and then throws it back into the river.\nIn this case the artist’s active work yields the same result as complete indifference.\nThe project itself has absolutely no effect on the river’s current ecological situation.']},

    $('lang-en').setAttribute('aria-pressed',String(lang==='en'));
    renderFilters();renderGallery();
    renderProjects();
if($('pd').open){var st=$('pd').scrollTop;openProject(pcur);$('pd').scrollTop=st;}
if($('lb').open)showLb(Math.min(cur,list.length-1));
  }

  document.querySelector('.lang').addEventListener('click',function(e){
    var b=e.target.closest('button[data-lang]');if(!b)return;
    lang=b.getAttribute('data-lang');
    try{localStorage.setItem('vr-lang',lang);}catch(err){}
    render();
  });
  $('filters').addEventListener('click',function(e){
    var b=e.target.closest('button[data-f]');if(!b)return;
    filter=b.getAttribute('data-f');renderFilters();renderGallery();
  });
  $('gallery').addEventListener('click',function(e){
    var b=e.target.closest('.tile');if(!b)return;
    list=glist;openLb(+b.getAttribute('data-n'));
  });
  $('lbClose').addEventListener('click',function(){$('lb').close();});
  $('lbPrev').addEventListener('click',function(){step(-1);});
  $('lbNext').addEventListener('click',function(){step(1);});
  $('lb').addEventListener('click',function(e){if(e.target===this)this.close();});
  document.addEventListener('keydown',function(e){
    if(!$('lb').open)return;
    if(e.key==='ArrowLeft')step(-1);
    if(e.key==='ArrowRight')step(1);
  });
$('projGrid').addEventListener('click',function(e){
var b=e.target.closest('.pcard');if(!b)return;
openProject(+b.getAttribute('data-p'));
});
$('pd').addEventListener('click',function(e){
if(e.target===this||e.target.closest('#pdClose')){this.close();return;}
var b=e.target.closest('.pd-grid button');if(!b)return;
var p=PJ[pcur];
list=pImgs(p).map(function(s,j){return {p:pcur,src:s,alt:p.t[1]+' — '+(j+1)};});
openLb(+b.getAttribute('data-j'));
});
render();

  /* keep anchor jumps (menu links) from hiding under the pinned header */
  var hdr=document.querySelector('.top');
  function syncHdr(){document.documentElement.style.setProperty('--hh',hdr.offsetHeight+'px');}
  syncHdr();
  if(window.ResizeObserver)new ResizeObserver(syncHdr).observe(hdr);
  else window.addEventListener('resize',syncHdr);
})();
</script>

</body>
</html>
